services:
  postgres-core:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: togglemaster
      POSTGRES_PASSWORD: togglemaster
      POSTGRES_DB: togglemaster
    volumes:
      - postgres-core-data:/var/lib/postgresql/data
      - ./auth-service/db/init.sql:/docker-entrypoint-initdb.d/01-auth.sql:ro
      - ./flag-service/db/init.sql:/docker-entrypoint-initdb.d/02-flag.sql:ro
      - ./docker/init/03-local-api-key.sql:/docker-entrypoint-initdb.d/03-local-api-key.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U togglemaster -d togglemaster"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-targeting:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: togglemaster
      POSTGRES_PASSWORD: togglemaster
      POSTGRES_DB: targeting
    volumes:
      - postgres-targeting-data:/var/lib/postgresql/data
      - ./targeting-service/db/init.sql:/docker-entrypoint-initdb.d/01-targeting.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U togglemaster -d targeting"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: "-jar DynamoDBLocal.jar -inMemory -sharedDb"

  auth-service:
   build:
     context: ./auth-service
   environment:
     PORT: 8001
     DATABASE_URL: postgres://togglemaster:togglemaster@postgres-core:5432/togglemaster?sslmode=disable
     MASTER_KEY: local-master-key
   ports:
     - "8001:8001"
   depends_on:
     postgres-core:
       condition: service_healthy

  flag-service:
    build:
      context: ./flag-service
    environment:
      PORT: 8002
      DATABASE_URL: postgres://togglemaster:togglemaster@postgres-core:5432/togglemaster
      AUTH_SERVICE_URL: http://auth-service:8001
    ports:
      - "8002:8002"
    depends_on:
      postgres-core:
        condition: service_healthy
      auth-service:
        condition: service_started

  targeting-service:
    build:
      context: ./targeting-service
    environment:
      PORT: 8003
      DATABASE_URL: postgres://togglemaster:togglemaster@postgres-targeting:5432/targeting
      AUTH_SERVICE_URL: http://auth-service:8001
    ports:
      - "8003:8003"
    depends_on:
      postgres-targeting:
        condition: service_healthy
      auth-service:
        condition: service_started

  evaluation-service:
    build:
      context: ./evaluation-service
    environment:
      PORT: 8004
      REDIS_URL: redis://redis:6379
      FLAG_SERVICE_URL: http://flag-service:8002
      TARGETING_SERVICE_URL: http://targeting-service:8003
      SERVICE_API_KEY: tm_key_local_compose_dev
    ports:
      - "8004:8004"
    depends_on:
      - redis
      - flag-service
      - targeting-service

  analytics-service:
    build:
      context: ./analytics-service
    environment:
      PORT: 8005
      AWS_REGION: us-east-1
      AWS_DYNAMODB_TABLE: ToggleMasterAnalytics
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    ports:
      - "8005:8005"
    depends_on:
      - dynamodb-local

volumes:
  postgres-core-data:
  postgres-targeting-data: